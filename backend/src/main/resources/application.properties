spring.application.name=career-portal
server.port=${PORT:8080}

# Production can provide PostgreSQL values. Without them, the free demo falls back to H2.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:/tmp/career_portal;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${JWT_SECRET:VGhpcy1pcy1hLWRldi1vbmx5LWtleS1jaGFuZ2UtaXQtaW4tcHJvZHVjdGlvbi0xMjM0NTY3ODkw}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.admin.email=${ADMIN_EMAIL:admin@careerportal.local}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
